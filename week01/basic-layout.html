<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid Layout | Web Page Structure</title>
    <meta name="description" content="Learn how to structure a web page using HTML5 semantic elements and CSS Grid to organize the header, navigation, main content, sidebar, and footer.">
    <link rel="stylesheet" href="styles/layout.css">
</head>

<body>
    <header>
        <h1>Header Content</h1>
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="#">Projects</a>
        <a href="#">Services</a>
        <a href="#">Contact Us</a>

    <main>

        <section>
            
            <h1>Main Content</h1>

        </section>

        <aside>
            <h2>Aside Content</h2>

        </aside>

    </main>

    <footer>
        <p>Footer Content © 2026</p>
    </footer>

  

</body>
</html>
